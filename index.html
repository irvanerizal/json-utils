<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JSON Formatter — format, minify, validate, compare & repair JSON online</title>
  <meta name="description" content="Free online JSON formatter: format, minify, validate, repair and compare JSON right in your browser. No data is sent to any server." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>JSON Formatter</h1>
      <span class="badge">100% client-side</span>
    </div>
    <button id="btn-theme" class="ghost" title="Toggle theme">Theme</button>
  </header>

  <main>
    <div class="toolbar">
      <button id="btn-format" class="primary">Format</button>
      <button id="btn-minify">Minify</button>
      <button id="btn-repair">Repair</button>
      <select id="indent" title="Indentation">
        <option value="2" selected>2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tab</option>
      </select>
      <span class="sep"></span>
      <button id="btn-copy">Copy</button>
      <button id="btn-download">Download</button>
      <button id="btn-clear" class="ghost">Clear</button>
    </div>

    <div class="toolbar">
      <button id="btn-sort">Sort keys</button>
      <button id="btn-ts">TS Types</button>
      <button id="btn-csv">CSV</button>
      <button id="btn-schema">JSON Schema</button>
      <button id="btn-escape">Escape</button>
      <button id="btn-unescape">Unescape</button>
    </div>

    <div class="editors">
      <div class="panel active" id="panel-a">
        <div class="panel-label"><span class="dot"></span>Before</div>
        <textarea id="input-a" spellcheck="false" placeholder='JSON A / "before", e.g. {"name":"Budi"}'></textarea>
      </div>

      <div class="center-actions">
        <button id="btn-copy-ab" title="Copy Before to After">→</button>
        <button id="btn-copy-ba" title="Copy After to Before">←</button>
        <button id="btn-swap" title="Swap Before and After">⇄</button>
        <button id="btn-compare" class="accent" title="Compare Before and After">Compare</button>
      </div>

      <div class="panel" id="panel-b">
        <div class="panel-label"><span class="dot"></span>After</div>
        <textarea id="input-b" spellcheck="false" placeholder='JSON B / "after", e.g. {"name":"Andi"}'></textarea>
      </div>
    </div>

    <section id="compare-section" class="hidden">
      <div class="panel-label section-title">Differences</div>
      <div class="compare-panels">
        <div class="panel">
          <div class="panel-label">Before</div>
          <pre id="compare-left"></pre>
        </div>
        <div class="panel">
          <div class="panel-label">After</div>
          <pre id="compare-right"></pre>
        </div>
      </div>
      <pre id="compare-output"></pre>
    </section>

    <footer class="statusbar">
      <span id="status">Ready — actions apply to the active field (Before/After)</span>
      <span id="stats" class="stats"></span>
    </footer>
  </main>

  <dialog id="result-dialog">
    <div class="dialog-head">
      <h2 id="dialog-title">Result</h2>
      <button id="btn-dialog-copy" class="primary">Copy</button>
      <button id="btn-dialog-close" class="ghost">Close</button>
    </div>
    <pre id="dialog-output"></pre>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
